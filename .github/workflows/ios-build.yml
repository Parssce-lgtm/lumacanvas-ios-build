name: Build iOS IPA
on:
  push:
    branches: [main]
    paths: ["LumaCanvas-iOS.zip", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract source project
        run: |
          mkdir -p source
          unzip -q LumaCanvas-iOS.zip -d source
          chmod +x source/LumaCanvas/scripts/*.sh
      - name: Show selected Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Run simulator tests
        run: source/LumaCanvas/scripts/test-ios.sh
      - name: Capture system theme previews
        run: source/LumaCanvas/scripts/capture-previews.sh
      - name: Build unsigned device IPA
        run: source/LumaCanvas/scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LumaCanvas-unsigned-IPA-${{ matrix.runner }}
          path: source/LumaCanvas/build/LumaCanvas-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: UI-previews-${{ matrix.runner }}
          path: source/LumaCanvas/build/Previews
          if-no-files-found: error
          retention-days: 7

